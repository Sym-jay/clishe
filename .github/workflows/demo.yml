name: Demo GIF

# Records demo.gif from demo.tape, and the README screenshots in
# docs/images/ from screenshots.tape, with VHS on Linux, so they can be
# made from any computer: change a tape (or run this by hand from the
# Actions tab), then download the artifacts and commit them.

on:
  workflow_dispatch:
  push:
    paths:
      - demo.tape
      - screenshots.tape
      - .github/workflows/demo.yml

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # DejaVu has the braille characters the thinking orbs are drawn with.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Record demo.tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape

      - name: Take screenshots.tape
        uses: charmbracelet/vhs-action@v2
        with:
          path: screenshots.tape

      - uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: demo.gif

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images/*.png
