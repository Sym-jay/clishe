name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: Check shell scripts
        run: |
          zsh -n clishe-bind.zsh
          bash -n clishe.sh install.sh clishe-bind.bash
          shellcheck -S warning clishe.sh clishe-bind.bash install.sh tests/test_shell_functions.sh

      - name: Check Python syntax
        run: |
          python -m py_compile *.py providers/*.py

      - name: Run shell-level regression tests
        run: bash tests/test_shell_functions.sh

      - name: Run zsh shortcut tests
        run: zsh tests/test_zsh_bind.zsh

      - name: Install as a package and run it
        run: |
          pip install .
          cd /tmp
          clishe --version
          test "$(clishe 'show me disk usage')" = "df -h"
          clishe explain tar -xzvf | grep -q "extract"
