name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check shell scripts
        run: |
          bash -n clishe.sh install.sh
          shellcheck -S warning clishe.sh install.sh tests/test_shell_functions.sh

      - name: Check Python syntax
        run: |
          python -m py_compile clishe_brain.py config.py knowledge.py safety.py providers/*.py

      - name: Run shell-level regression tests
        run: bash tests/test_shell_functions.sh
