name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check shell script syntax
        run: bash -n clishe.sh

      - name: Check Python syntax
        run: |
          python -m py_compile clishe_brain.py config.py knowledge.py
          python -m py_compile providers/__init__.py providers/base.py providers/ollama_provider.py providers/anthropic_provider.py

      - name: Validate JSON data files
        run: |
          python -c "import json; json.load(open('command_dictionary.json'))"
          python -c "import json; json.load(open('error_patterns.json'))"

      - name: Run shell-level regression tests
        run: bash tests/test_shell_functions.sh
