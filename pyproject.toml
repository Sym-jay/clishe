[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clishe-cli"
version = "0.2.0"
description = "A friendly, adaptive command-line assistant that helps Linux beginners learn the shell"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Sym-jay"}]
keywords = ["cli", "linux", "shell", "beginner", "ai", "assistant"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Education",
]
# Intentionally empty: the core (KB, prediction, provider dispatch) is
# stdlib-only by design so `clishe` runs with nothing but Python 3 and bash.
dependencies = []

[project.urls]
Homepage = "https://github.com/Sym-jay/clishe"
Issues = "https://github.com/Sym-jay/clishe/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
